name: checkout-stub
inputs: {ref: {required: false}, fetch-depth: {required: false}, persist-credentials: {required: false}, sparse-checkout: {required: false}, sparse-checkout-cone-mode: {required: false}}
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # clone refuses a nonempty destination, including an existing checkout.
        git clone --no-checkout -- "${ACT_SRC:?set ACT_SRC to the fixture repository}" .
        git checkout --detach "${GITHUB_SHA:?missing fixture revision}"
        git log --oneline -1
        git describe --tags

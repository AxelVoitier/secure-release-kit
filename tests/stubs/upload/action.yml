name: upload-stub
inputs: {name: {required: true}, path: {required: true}, if-no-files-found: {required: false}}
runs:
  using: composite
  steps:
    - shell: bash
      env: {N: "${{ inputs.name }}", P: "${{ inputs.path }}"}
      run: 'mkdir -p "$ACT_ART/$N" && cp -r $P "$ACT_ART/$N/" && ls "$ACT_ART/$N"'

name: upload-stub
inputs:
  name:
    required: true
  path:
    required: true
  if-no-files-found:
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        ARTIFACT_PATH: ${{ inputs.path }}
      run: |
        destination="$ACT_ART/$ARTIFACT_NAME"
        mkdir -p "$destination"
        # Action paths can include whitespace-separated glob patterns.
        cp -r $ARTIFACT_PATH "$destination/"
        ls "$destination"

name: download-stub
inputs:
  name:
    required: false
  path:
    required: false
  pattern:
    required: false
  merge-multiple:
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        ARTIFACT_PATH: ${{ inputs.path }}
      run: |
        mkdir -p "$ARTIFACT_PATH"
        cp -r "$ACT_ART/$ARTIFACT_NAME/." "$ARTIFACT_PATH/"
        ls "$ARTIFACT_PATH"

name: download-stub
inputs: {name: {required: false}, path: {required: false}, pattern: {required: false}, merge-multiple: {required: false}}
runs:
  using: composite
  steps:
    - shell: bash
      env: {N: "${{ inputs.name }}", P: "${{ inputs.path }}"}
      run: 'mkdir -p "$P" && cp -r "$ACT_ART/$N/." "$P/" && ls "$P"'

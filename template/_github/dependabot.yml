# Used after this directory is copied to .github/ in a deployed project.
# Proposes SHA-pinned action updates. The original kit's nested template uses Renovate.
# Does not cover Python, uv, the cooldown, the cutoff date, or tool pins.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
